[origin_base]
url = "https://gateway-v0-http.kaiko.ovh"
[origin_base.method]
type = "http"

[bench_base]
url = "https://gateway-v0-http.kaiko.ovh"
[bench_base.method]
type = "http"

stream = true

[headers.origin.api_key]
name = "key"
value = "xxxx"

[headers.bench.api_key]
name = "key"
value = "xxxx"

[rates]

[rates.from]
path = "api/stream/index_v1"
method = "Post"
check_path = "$.result.percentages[0].price"
reconcile_path = "$.result.interval.endTime"

[rates.from.params]
args = '{"indexCode": "KK_BRR_BTCUSD"}'

[rates.target]
path = "api/stream/index_v1"
method = "Post"
check_path = "$.result.percentages[0].price"
reconcile_path = "$.result.interval.endTime"

[rates.target.params]
args = '{"indexCode": "KK_BRR_ETHUSD"}'
