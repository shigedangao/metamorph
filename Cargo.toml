[package]
edition = "2024"
name = "metamorph"
version = "0.1.6"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
futures = { version = "0.3.32", features = ["std"], default-features = false }
granc_core = "0.6.5"
reqwest = { version = "0.13.4", features = ["json"] }
reqwest-streams = { version = "0.15", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_json_path = "0.7.2"
spinners = "4.2.0"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tonic = { version = "0.14.6", features = ["tls-native-roots"] }
